[package]
name = "miner"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "miner"
path = "src/main.rs"

[dependencies]
btclib = { path = "../lib" }
tokio = { version = "1.37.0", features = ["full"] }
clap = { version = "4.5.8", features = ["derive"] }
flume = "0.11.0"
anyhow = "1.0.86"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
chrono = "0.4.38"
uuid = { version = "1.8.0", features = ["v4"] }

